<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset='utf-8'>
    <title>CCRP - Registrarse</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="main.css">
    <img src="25Años.png" alt="logo" height="150">
</head>
<body>
    <h1>Hola!</h1>
    <hr>
    <br>
    <h3>Complete esta información</h3>
    <form action="home_logged.html">
        <label for="campo_nombre">Nombre</label>
        <br>
        <input id="campo_nombre" name="nombre" type="text">
        <br>
        <br>
        <label for="campo_dni">DNI</label>
        <br>
        <input id="campo_dni" name="dni" type="text">
        <br>
        <br>
        <label for="campo_nombre">Correo</label>
        <br>
        <input id="campo_correo" name="correo" type="text">
        <br>
        <br>
        <label for="campo_contraseña">Contraseña</label>
        <br>
        <input id="campo_contraseña" name="contraseña" type="text">
        <br>
        <br>
        <input type="checkbox" id="TyC" name="recibir_notificaciones">
        <label for="recibir_notificaciones">Quiero recibir notificaciones por correo</label>
        <br>
        <br>
        <input type="checkbox" id="TyC" name="Términos y condiciones">
        <label for="TyC">Acepto los términos y condiciones</label>
        <br>
        <br>
        <button type="submit">Registrarse</button>
    </form>
    <script src="main.js"></script>
</body>
</html>
