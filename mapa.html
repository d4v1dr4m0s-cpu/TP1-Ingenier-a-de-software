<!DOCTYPE html>
<html>

<head>
    <title>Mapa de talleres</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="mapa.css">
</head>

<body>
    <div class="buscador-container">
        <input type="text" id="barra_buscador" placeholder="Ingrese el taller o servicio (ej: guitarra)">
        <button type="button" id="btnBuscar">Buscar</button>
        <button type="button" onclick="window.location.href='home_logged.html'"
            style="background-color: #6c757d; color: white;">Volver</button>
    </div>

    <div class="mapa-talleres">

        <div id="map" style="height: 700px; width: 100%; margin-top: 20px; margin-right: 20px;">
        </div>

        <div class="talleres-container">
            <ul id="lista-talleres"></ul>
        </div>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="mapa.js"></script>
    
</body>

</html>
